[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conrrad-sdk"
version = "3.2.6"
description = "CONRRAD SDK — governed causal runtime for persistent cognitive systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "CONRRAD", email = "protocol@conrrad.dev" }]
keywords = ["ai", "agents", "governance", "runtime", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=42.0.0,<44.0.0",
    "redis>=5.0.0,<6.0.0",
    "httpx>=0.27.0,<1.0.0",
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "docker>=7.0.0,<8.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "typer>=0.12.0,<1.0.0",
    "tenacity>=8.0.0,<10.0.0",
    "structlog>=24.0.0,<26.0.0",
    "pynacl>=1.5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "hypothesis>=6.0.0,<7.0.0",
]
rust = ["maturin>=1.0,<2.0"]

[project.scripts]
conrrad = "conrrad_sdk.cli.__main__:main"

[project.urls]
Homepage = "https://conrrad.dev"
Repository = "https://github.com/GRECOITALICO/CONRRAD-SDK"
Documentation = "https://conrrad.dev/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["conrrad_sdk*", "conrrad*", "kap_escrow*"]
