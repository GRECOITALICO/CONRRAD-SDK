name: Documentation governance

on:
  pull_request:
    paths:
      - 'conrrad_sdk/**'
      - 'kap_escrow/**'
      - 'pyproject.toml'
      - 'docs/**'
      - 'CHANGELOG.md'
  push:
    branches: [main]
    paths:
      - 'conrrad_sdk/**'
      - 'docs/**'

jobs:
  docs-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check docs accompany surface changes
        run: bash scripts/check-docs-governance.sh
        env:
          DOCS_GOV_BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
      - name: Verify golden replay_hash fixtures
        run: python3 scripts/verify_golden_replay_hash.py
      - name: Canonical governance (CVS-001 registry + vocabulary + ontology lint)
        run: python3 scripts/check_canonical_governance.py
      - name: Registry backward compatibility (breaking changes need ontology_version bump)
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_registry_compat.py
        env:
          ONTOLOGY_BASE_REF: ${{ github.event.pull_request.base.sha }}
